{% set name = "r-localignr" %}
{% set version = "0.2.1" %}
{% set build = 4 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: {{ build }}
  noarch: generic
  script: R CMD INSTALL . --no-multiarch

requirements:
  host:
    - r-base >=4.2.0
    - r-shiny
    - r-rappdirs
    - r-shinythemes
    - r-dt
    - r-shinyfiles
    - r-shinybusy
    - r-xml
    - r-plyr
    - r-dplyr
    - r-yaml
    - r-processx
    - r-digest
    - r-htmltools
    - r-htmlwidgets
    - r-openxlsx
    - r-jsonlite
    - r-rcpp
    - r-later
    - r-promises
    - r-httpuv
    - r-rlang
  run:
    - r-base >=4.2.0
    - r-shiny
    - r-rappdirs
    - r-shinythemes
    - r-dt
    - r-shinyfiles
    - r-shinybusy
    - r-xml
    - r-plyr
    - r-dplyr
    - r-yaml
    - r-processx
    - r-digest
    - r-htmltools
    - r-htmlwidgets
    - r-openxlsx
    - r-jsonlite
    - r-rcpp
    - r-later
    - r-promises
    - r-httpuv
    - r-rlang
    - blast >=2.12.0
    - diamond >=2.0.0

test:
  commands:
    - >-
      $R --vanilla -e
      "library('LocAlignR');
      stopifnot(as.character(packageVersion('LocAlignR')) == '{{ version }}');
      stopifnot(is.function(LocAlignR::run_app))"
    - blastp -version
    - blastn -version
    - blastx -version
    - tblastn -version
    - tblastx -version
    - makeblastdb -version
    - diamond version

about:
  home: https://github.com/franciscolobo/LocAlignR
  license: MIT
  license_file: LICENSE
  summary: 'Local alignment visualization and analysis tool'

extra:
  recipe-maintainers:
    - franciscolobo
